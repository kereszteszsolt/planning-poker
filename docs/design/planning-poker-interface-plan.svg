  </style>
</defs><rect width="1800" height="1050" fill="#f8fafc"/><circle cx="1665" cy="-20" r="250" fill="#dbeafe" opacity="0.7"/><circle cx="1780" cy="1040" r="260" fill="#e0f2fe" opacity="0.75"/><text x="48" y="48" class="eyebrow">PORTABLE DESIGN HANDOFF · RELEASE 0.2 PLAN</text><text x="48" y="92" class="title">Planning Poker interface plan</text><text x="48" y="123" class="subtitle">Current flow preserved · responsive hierarchy improved · Penpot and code joined by design tokens</text><rect x="40" y="155" width="420" height="350" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><text x="68" y="195" class="section">Core user flow</text><text x="68" y="222" class="body">One room, one estimate, one discussion loop.</text><rect x="70" y="260" width="160" height="88" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1"/><circle cx="94" cy="285" r="14" fill="#2563eb"/><text x="94" y="290" class="label" text-anchor="middle" style="fill:#ffffff">1</text><text x="118" y="287" class="label">Home</text><text x="88" y="318" class="tiny">Create or enter room</text><rect x="260" y="260" width="160" height="88" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1"/><circle cx="284" cy="285" r="14" fill="#2563eb"/><text x="284" y="290" class="label" text-anchor="middle" style="fill:#ffffff">2</text><text x="308" y="287" class="label">Join</text><text x="278" y="318" class="tiny">Choose a display name</text><rect x="70" y="380" width="160" height="88" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1"/><circle cx="94" cy="405" r="14" fill="#2563eb"/><text x="94" y="410" class="label" text-anchor="middle" style="fill:#ffffff">3</text><text x="118" y="407" class="label">Vote</text><text x="88" y="438" class="tiny">Cards stay hidden</text><rect x="260" y="380" width="160" height="88" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1"/><circle cx="284" cy="405" r="14" fill="#2563eb"/><text x="284" y="410" class="label" text-anchor="middle" style="fill:#ffffff">4</text><text x="308" y="407" class="label">Reveal</text><text x="278" y="438" class="tiny">Discuss, reset, repeat</text><line x1="230" y1="304" x2="255" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="350" x2="340" y2="374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="260" y1="424" x2="235" y2="424" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="68" y="480" class="tiny">Design review keeps this mental model unchanged.</text><rect x="490" y="155" width="855" height="540" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><text x="520" y="195" class="section">Desktop room workspace</text><text x="520" y="222" class="body">Voting first, room utilities second, results stable below.</text><rect x="520" y="245" width="795" height="420" rx="14" fill="#f8fbff" stroke="#cbd5e1" stroke-width="1"/><rect x="520" y="245" width="795" height="48" rx="14" fill="#2563eb"/><rect x="520" y="276" width="795" height="17" fill="#2563eb"/><text x="542" y="276" class="label" style="fill:#ffffff">Planning Poker</text><text x="1268" y="276" class="tiny" text-anchor="end" style="fill:#ffffff">Home   About</text><rect x="540" y="313" width="505" height="196" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="560" y="344" class="label">Value set · Scrum</text><circle cx="560" cy="369" r="7" fill="#2563eb" stroke="#94a3b8"/><text x="573" y="374" class="tiny">Scrum</text><circle cx="665" cy="369" r="7" fill="#ffffff" stroke="#94a3b8"/><text x="678" y="374" class="tiny">Fibonacci</text><circle cx="770" cy="369" r="7" fill="#ffffff" stroke="#94a3b8"/><text x="783" y="374" class="tiny">T-shirt</text><circle cx="875" cy="369" r="7" fill="#ffffff" stroke="#94a3b8"/><text x="888" y="374" class="tiny">Days</text><rect x="560" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="580" y="424" class="label" text-anchor="middle" style="fill:#ffffff">0</text><rect x="610" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="630" y="424" class="label" text-anchor="middle" style="fill:#ffffff">1</text><rect x="660" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="680" y="424" class="label" text-anchor="middle" style="fill:#ffffff">2</text><rect x="710" y="392" width="40" height="54" rx="8" fill="#1d4ed8"/><text x="730" y="424" class="label" text-anchor="middle" style="fill:#ffffff">3</text><rect x="760" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="780" y="424" class="label" text-anchor="middle" style="fill:#ffffff">5</text><rect x="810" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="830" y="424" class="label" text-anchor="middle" style="fill:#ffffff">8</text><rect x="860" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="880" y="424" class="label" text-anchor="middle" style="fill:#ffffff">13</text><rect x="910" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="930" y="424" class="label" text-anchor="middle" style="fill:#ffffff">?</text><rect x="960" y="392" width="40" height="54" rx="8" fill="#60a5fa"/><text x="980" y="424" class="label" text-anchor="middle" style="fill:#ffffff">∞</text><rect x="560" y="461" width="145" height="32" rx="8" fill="#16a34a"/><text x="632.5" y="482" class="tiny" text-anchor="middle" style="fill:#ffffff">Reveal votes</text><rect x="715" y="461" width="145" height="32" rx="8" fill="#d97706"/><text x="787.5" y="482" class="tiny" text-anchor="middle" style="fill:#ffffff">Reset votes</text><rect x="870" y="461" width="145" height="32" rx="8" fill="#dc2626"/><text x="942.5" y="482" class="tiny" text-anchor="middle" style="fill:#ffffff">Revoke vote</text><rect x="1060" y="313" width="235" height="95" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1078" y="341" class="label">Room</text><text x="1078" y="365" class="tiny">84fd…a2c1</text><rect x="1078" y="377" width="94" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><rect x="1182" y="377" width="94" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/><text x="1125" y="392" class="tiny" text-anchor="middle" style="fill:#2563eb">Copy ID</text><text x="1229" y="392" class="tiny" text-anchor="middle" style="fill:#2563eb">Copy link</text><rect x="1060" y="420" width="235" height="225" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1078" y="449" class="label">Participants</text><text x="1078" y="478" class="body">Alex</text><text x="1276" y="478" class="tiny" text-anchor="end">Moderator · You</text><line x1="1078" y1="491" x2="1276" y2="491" stroke="#e2e8f0" stroke-width="1"/><text x="1078" y="517" class="body">Sam</text><text x="1276" y="517" class="tiny" text-anchor="end">Voted</text><line x1="1078" y1="530" x2="1276" y2="530" stroke="#e2e8f0" stroke-width="1"/><text x="1078" y="556" class="body">Riley</text><text x="1276" y="556" class="tiny" text-anchor="end">Voted</text><line x1="1078" y1="569" x2="1276" y2="569" stroke="#e2e8f0" stroke-width="1"/><text x="1078" y="595" class="body">Jordan</text><text x="1276" y="595" class="tiny" text-anchor="end">Waiting</text><rect x="540" y="523" width="505" height="122" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="560" y="551" class="label">Votes and statistics</text><rect x="560" y="566" width="42" height="44" rx="8" fill="#3b82f6"/><text x="581" y="594" class="label" text-anchor="middle" style="fill:#ffffff">3</text><rect x="615" y="566" width="42" height="44" rx="8" fill="#3b82f6"/><text x="636" y="594" class="label" text-anchor="middle" style="fill:#ffffff">5</text><rect x="670" y="566" width="42" height="44" rx="8" fill="#3b82f6"/><text x="691" y="594" class="label" text-anchor="middle" style="fill:#ffffff">3</text><rect x="725" y="566" width="42" height="44" rx="8" fill="#3b82f6"/><text x="746" y="594" class="label" text-anchor="middle" style="fill:#ffffff">8</text><text x="805" y="582" class="tiny">Average 4.75  ·  Min 3  ·  Max 8</text><text x="805" y="606" class="tiny">Distribution: 3 ×2 · 5 ×1 · 8 ×1</text><text x="520" y="682" class="tiny">Target: accessible labels, non-blocking feedback, visible focus, no horizontal overflow.</text><rect x="1375" y="155" width="385" height="540" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><text x="1405" y="195" class="section">Mobile hierarchy</text><text x="1405" y="222" class="body">One-column flow with persistent context.</text><rect x="1455" y="245" width="225" height="420" rx="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1"/><rect x="1530" y="257" width="75" height="8" rx="4" fill="#cbd5e1"/><rect x="1471" y="280" width="193" height="42" rx="8" fill="#2563eb"/><text x="1485" y="306" class="tiny" style="fill:#ffffff">Planning Poker</text><rect x="1471" y="334" width="193" height="44" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="1485" y="353" class="label">Room connected</text><text x="1485" y="370" class="tiny">Scrum · 4 participants</text><rect x="1471" y="388" width="193" height="112" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1485" y="410" class="label">Choose an estimate</text><rect x="1485" y="425" width="28" height="42" rx="6" fill="#60a5fa"/><text x="1499" y="451" class="tiny" text-anchor="middle" style="fill:#ffffff">1</text><rect x="1519" y="425" width="28" height="42" rx="6" fill="#60a5fa"/><text x="1533" y="451" class="tiny" text-anchor="middle" style="fill:#ffffff">2</text><rect x="1553" y="425" width="28" height="42" rx="6" fill="#1d4ed8"/><text x="1567" y="451" class="tiny" text-anchor="middle" style="fill:#ffffff">3</text><rect x="1587" y="425" width="28" height="42" rx="6" fill="#60a5fa"/><text x="1601" y="451" class="tiny" text-anchor="middle" style="fill:#ffffff">5</text><rect x="1621" y="425" width="28" height="42" rx="6" fill="#60a5fa"/><text x="1635" y="451" class="tiny" text-anchor="middle" style="fill:#ffffff">8</text><rect x="1485" y="475" width="165" height="17" rx="5" fill="#dc2626"/><text x="1568" y="488" class="tiny" text-anchor="middle" style="fill:#ffffff">Revoke vote</text><rect x="1471" y="510" width="193" height="62" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1485" y="532" class="label">Votes and results</text><text x="1485" y="553" class="tiny">Hidden until reveal</text><rect x="1471" y="581" width="193" height="58" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1485" y="603" class="label">Participants</text><text x="1485" y="623" class="tiny">Alex · Sam · Riley · Jordan</text><text x="1568" y="681" class="tiny" text-anchor="middle">430 px review target</text><rect x="40" y="725" width="850" height="285" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><text x="68" y="765" class="section">Design-token tiers</text><text x="68" y="792" class="body">A shared language for Penpot, generated CSS variables, and React components.</text><rect x="70" y="825" width="230" height="102" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="88" y="855" class="label">1 · Global</text><text x="88" y="881" class="tiny">Palette, type, spacing, radius</text><text x="88" y="903" class="tiny">No arbitrary production values</text><rect x="335" y="825" width="230" height="102" rx="14" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1"/><text x="353" y="855" class="label">2 · Semantic</text><text x="353" y="881" class="tiny">Page, surface, text, action, status</text><text x="353" y="903" class="tiny">No arbitrary production values</text><rect x="600" y="825" width="230" height="102" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="855" class="label">3 · Component</text><text x="618" y="881" class="tiny">Button, vote card, panel, row</text><text x="618" y="903" class="tiny">No arbitrary production values</text><line x1="300" y1="876" x2="328" y2="876" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="565" y1="876" x2="593" y2="876" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#2563eb"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#3b82f6"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#16a34a"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#d97706"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#dc2626"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#111827"/><rect x="70" y="950" width="52" height="28" rx="7" fill="#2563eb"/><rect x="142" y="950" width="52" height="28" rx="7" fill="#3b82f6"/><rect x="214" y="950" width="52" height="28" rx="7" fill="#16a34a"/><rect x="286" y="950" width="52" height="28" rx="7" fill="#d97706"/><rect x="358" y="950" width="52" height="28" rx="7" fill="#dc2626"/><rect x="430" y="950" width="52" height="28" rx="7" fill="#111827"/><text x="520" y="971" class="tiny">Draft tokens are documentation until generated and tested.</text><rect x="920" y="725" width="840" height="285" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><text x="948" y="765" class="section">Release 0.2 design principles</text><text x="948" y="792" class="body">Improve confidence and maintainability without changing the product’s purpose.</text><circle cx="957" cy="834" r="9" fill="#2563eb"/><path d="M 953 834 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="976" y="832" class="label">Stable real-time state</text><text x="976" y="852" class="tiny">Recover or resynchronize explicitly; never rely on stale closures.</text><circle cx="1347" cy="834" r="9" fill="#2563eb"/><path d="M 1343 834 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1366" y="832" class="label">Focused state management</text><text x="1366" y="852" class="tiny">Zustand for shared serializable state; local state stays local.</text><circle cx="957" cy="892" r="9" fill="#2563eb"/><path d="M 953 892 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="976" y="890" class="label">Responsive by contract</text><text x="976" y="910" class="tiny">Desktop, tablet, and mobile states are designed and tested.</text><circle cx="1347" cy="892" r="9" fill="#2563eb"/><path d="M 1343 892 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1366" y="890" class="label">Accessible feedback</text><text x="1366" y="910" class="tiny">Status and errors are not color-only.</text><circle cx="957" cy="950" r="9" fill="#2563eb"/><path d="M 953 950 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="976" y="948" class="label">Privacy-safe evidence</text><text x="976" y="968" class="tiny">Invented deterministic data only.</text><circle cx="1347" cy="950" r="9" fill="#2563eb"/><path d="M 1343 950 l 3 3 l 6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1366" y="948" class="label">Monorepo clarity</text><text x="1366" y="968" class="tiny">Tasks and contracts stay explicit.</text></svg>
