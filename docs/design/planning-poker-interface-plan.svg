<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc"><title id="title">Planning Poker interface plan</title><desc id="desc">A portable design board showing the core user flow, desktop and mobile room layouts, design token tiers, and Release 0.2 design principles.</desc><defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #2563eb; }
    .title { font-size: 36px; font-weight: 800; }
    .subtitle { font-size: 18px; fill: #475569; }
    .section { font-size: 22px; font-weight: 800; }
